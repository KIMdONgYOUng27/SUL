function defaultPrompts(section,status){
 if(section==='opening')return [q('intro','한국을 여행하면서 일상적인 일을 어떻게 경험하셨는지 듣고 싶습니다. 좋았던 경험과 예상과 달랐던 경험 모두 편하게 말씀해주세요.','I would like to hear about everyday experiences during your trip to Korea, both things that went well and things that differed from your expectations.','메모 목적을 알리고, 녹음한다면 별도로 동의를 받으세요. 답변을 원치 않는 질문은 건너뛸 수 있다고 안내합니다.'),q('day','이번 한국 여행에서 기억에 남는 하루를 떠올려주세요. 그날 어디에 가서 무엇을 하셨는지 편하게 들려주실 수 있나요?','Think of a memorable day on this trip to Korea. Could you tell me where you went and what you did?','하루가 떠오르지 않으면 관광이나 구매 장면 하나로 좁혀주세요.',['그날은 누구와 함께 다니셨어요?','그곳에는 어떤 이유로 가게 되셨어요?','그중 한 장면을 조금 더 자세히 들어봐도 될까요?']),q('context','이번에는 얼마나 여행하시고, 주로 누구와 함께 다니고 계세요? 한국어로 안내를 읽거나 대화할 때는 어떠세요?','How long is this trip, who do you usually travel with, and how comfortable are you reading or speaking Korean?','이미 나온 내용은 다시 묻지 않고 기록만 보충합니다.')];
 if(section==='closing')return [q('check','제가 이해한 바로는 [상황]에서 [일어난 일]이 있었고, 그래서 [행동·결과]가 있었다는 말씀이시죠? 다르게 이해한 부분이 있을까요?','My understanding is that [event] happened in [situation], and you [action/result]. Have I understood correctly?','오른쪽 기록이나 요약을 참고해 실제 발언만 되짚습니다.'),q('priority','오늘 이야기한 경험 중 다음 한국 여행에서는 가장 달라졌으면 하는 순간이 있나요?','Of the experiences we discussed, is there a moment you would most like to be different on your next trip?','없다면 그대로 기록합니다.',['그 순간을 고르신 이유는 무엇인가요?','그때 무엇이 달라지면 좋을까요?']),q('last','제가 놓쳤거나 더 남기고 싶은 이야기가 있으신가요? 직접 겪으신 이야기를 들려주셔서 감사합니다.','Is there anything I missed or anything else you would like to add? Thank you for sharing your experiences.','답변을 확인한 뒤 인터뷰 완료를 누르세요.')];

function allPrompts(section){const map=new Map();for(const status of [undefined,...statuses.map(x=>x[0])])for(const p of prompts(section,status))map.set(p.id,p);return [...map.values()];}
function historyHTML(section){const s=current(),entries=Object.entries(s.responses).filter(([key,r])=>key.startsWith(section+':')&&(r.quote||r.note||r.tags.length));if(!entries.length)return '<p class="empty">아직 기록된 답변이 없습니다 · 미확인</p>';return entries.map(([key,r])=>{const id=key.slice(section.length+1),p=r.question||allPrompts(section).find(x=>x.id===id),active=prompts(section,s.statuses[section]).some(x=>x.id===id);return `<details><summary>${esc(p?.ko||id)} ${active?'':' · 이전 분기 기록'}</summary><p>${esc(r.quote||'직접 발언 미확인')}</p>${r.note?`<p>메모: ${esc(r.note)}</p>`:''}${r.tags.map(t=>`<span class="badge">${esc(t)}</span>`).join('')}${active?`<p><button data-edit="${esc(key)}">이 질문 수정</button></p>`:''}</details>`;}).join('');}
function renderNotebook(){const s=current(),count=Object.values(s.responses).filter(r=>r.quote||r.note).length;$('#notebook').innerHTML=`<div class="note-card"><div class="eyebrow">PARTICIPANT NOTES</div><h3 style="margin-top:8px">${esc(s.code)}의 여행 맥락</h3><label for="profile">기간 · 동행 · 한국어 등</label><textarea id="profile" placeholder="대화 중 자연스럽게 나온 배경을 기록하세요. 이름·연락처는 필요하지 않습니다.">${esc(s.profile)}</textarea><div class="metric"><div><span class="count">${count}</span><small>질문 기록</small></div><div><span class="count">${s.events.length}</span><small>새로운 이야기</small></div></div><p class="empty">발언과 해석을 나눠 적어주세요.<br>묻지 않은 내용은 ‘미확인’입니다.</p></div><div class="note-card"><h3>대화 밖으로 나온 발견</h3><p class="empty">새로운 불편, 여러 주제에 걸친 사건,<br>나중에 돌아올 이야기를 남겨두세요.</p><button data-action="event">＋ 이야기 추가</button>${s.events.map(e=>`<div class="event"><div class="event-title">${e.topics.map(t=>sections.find(x=>x.id===t)?.name||s.pageInfo?.[t]?.name||'기타 관광 경험').map(esc).join(' · ')}</div><p>${esc(e.quote)}</p>${e.note?`<p class="muted">메모: ${esc(e.note)}</p>`:''}<button data-event-edit="${esc(e.id)}">수정</button></div>`).join('')}</div>`;}
function go(section){current().section=section;showProbes=false;save();render();}
function finishSection(){const s=current();s.done[s.section]=true;if(s.section==='closing'){s.complete=true;save();render();openSummary();return;}const next=sections.slice(sections.findIndex(x=>x.id===s.section)+1).find(x=>!s.done[x.id])||sections.find(x=>!s.done[x.id]);go(next?.id||'closing');}
function openEvent(id){const s=current(),e=s.events.find(x=>x.id===id),dialog=$('#event-dialog');dialog.innerHTML=`<div class="dialog-head"><h2>${e?'이야기 수정':'예상 밖 이야기 기록'}</h2><button data-action="close-event" aria-label="닫기">×</button></div><p class="muted">현재 질문은 그대로 유지됩니다. 여러 주제를 함께 선택할 수 있어요.</p><label for="event-quote">무슨 이야기가 나왔나요? · 직접 발언</label><textarea id="event-quote">${esc(e?.quote||'')}</textarea><label for="event-note">맥락 · 대응 · 결과 / 인터뷰어 메모</label><textarea class="short" id="event-note">${esc(e?.note||'')}</textarea><label>관련 주제</label><div class="tag-list">${[...sections.filter(x=>!['opening','closing'].includes(x.id)),{id:'other',name:'기타 관광 경험'}].map(x=>`<button data-event-topic="${x.id}" aria-pressed="${(e?.topics||[!['opening','closing'].includes(s.section)?s.section:'other']).includes(x.id)}" class="${(e?.topics||[!['opening','closing'].includes(s.section)?s.section:'other']).includes(x.id)?'selected':''}">${esc(x.name)}</button>`).join('')}</div><p class="muted">다시 연결하기: “말씀해주신 내용은 따로 남겨둘게요. 아까 이야기로 돌아가도 괜찮을까요?”</p><div class="actions"><button data-action="close-event">돌아가기</button><button class="primary" id="save-event">기록 저장</button></div>`;dialog.showModal();$('#save-event').onclick=()=>{const quote=$('#event-quote').value.trim(),note=$('#event-note').value.trim();if(!quote&&!note){toast('이야기나 메모를 입력해주세요.');return;}const topics=[...dialog.querySelectorAll('[data-event-topic][aria-pressed="true"]')].map(b=>b.dataset.eventTopic),data={id:e?.id||crypto.randomUUID(),quote,note,topics:topics.length?topics:['other'],sourceSection:e?.sourceSection||s.section,createdAt:e?.createdAt||new Date().toISOString()};if(e)s.events[s.events.indexOf(e)]=data;else s.events.push(data);save();dialog.close();renderNotebook();bindProfile();toast('이야기를 저장했습니다.');};}
function summaryText(s){let text=`${s.code} 인터뷰 기록\n상태: ${s.complete?'완료':'진행 중'}\n일시: ${s.createdAt}\n\n여행 맥락: ${s.profile||'미확인'}\n`;for(const sec of recordSections(s)){text+=`\n[${sec.name}]\n경험 상태: ${statuses.find(x=>x[0]===s.statuses[sec.id])?.[1]||'미확인'}\n`;for(const [key,r]of Object.entries(s.responses).filter(([k])=>k.startsWith(sec.id+':'))){const id=key.slice(sec.id.length+1),p=r.question||allPrompts(sec.id).find(x=>x.id===id),active=prompts(sec.id,s.statuses[sec.id]).some(x=>x.id===id);text+=`\n질문: ${p?.ko||id}${active?'':' [이전 분기 기록]'}\n직접 발언: ${r.quote||'미확인'}\n인터뷰어 메모: ${r.note||'없음'}\n태그: ${r.tags.join(', ')}\n`;}}text+='\n[예상 밖 이야기]\n';for(const e of s.events)text+=`\n관련 주제: ${e.topics.join(', ')}\n직접 발언: ${e.quote}\n메모: ${e.note}\n`;return text;}
function openSummary(){const s=current(),d=$('#summary-dialog');d.innerHTML=`<div class="dialog-head"><div><div class="eyebrow">INTERVIEW RECORD</div><h2>${esc(s.code)} · ${s.complete?'완료':'진행 중'}</h2></div><button data-action="close-summary" aria-label="닫기">×</button></div><p class="muted">자동 해석 없이 입력한 기록을 모았습니다. 미입력은 미확인으로 표시됩니다.</p><div class="export-bar"><button class="primary" data-action="export-md">이 인터뷰 텍스트 ↓</button><button data-action="export-json">이 인터뷰 JSON ↓</button><button data-action="export-csv">전체 주제별 CSV ↓</button></div><p>${esc(s.profile||'여행 맥락 미확인')}</p>${recordSections(s).map(sec=>`<div class="summary-row timeline"><h3>${esc(sec.name)} ${s.done[sec.id]?'✓':''}</h3><span class="muted">${statuses.find(x=>x[0]===s.statuses[sec.id])?.[1]||'경험 상태 미확인'}</span>${historyHTML(sec.id)}</div>`).join('')}<div class="summary-row"><h3>예상 밖 이야기</h3>${s.events.map(e=>`<p>${esc(e.quote)}<br><span class="muted">${esc(e.note)}</span></p>`).join('')||'<p class="muted">기록 없음</p>'}</div><p class="muted">이 브라우저의 인터뷰 ${db.sessions.length}개가 저장되어 있습니다. 전체 백업으로 다른 기기에 옮길 수 있습니다.</p>`;if(!d.open)d.showModal();}
function download(data,type,name){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function exportCSV(){const rows=[['participant','interview_status','section','experience','question_id','question','direct_response','interviewer_note','tags','branch_active','related_topics','profile']];for(const s of db.sessions){for(const [key,r]of Object.entries(s.responses)){const [section,id]=key.split(':'),p=r.question||allPrompts(section).find(x=>x.id===id);rows.push([s.code,s.complete?'완료':'진행 중',sections.find(x=>x.id===section)?.name||s.pageInfo?.[section]?.name||section,statuses.find(x=>x[0]===s.statuses[section])?.[1]||'미확인',id,p?.ko||id,r.quote||'미확인',r.note,r.tags.join('|'),prompts(section,s.statuses[section]).some(x=>x.id===id)?'yes':'no',section,s.profile]);}for(const e of s.events)rows.push([s.code,s.complete?'완료':'진행 중','예상 밖 이야기','',e.id,'',e.quote,e.note,'','',e.topics.join('|'),s.profile]);}download('\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8','사이-전체인터뷰.csv');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const s=current();if(b.dataset.section){go(b.dataset.section);return;}if(b.dataset.status){s.statuses[s.section]=b.dataset.status;s.done[s.section]=false;save();render();return;}if(b.dataset.tag){const r=response(true),t=b.dataset.tag;r.tags=r.tags.includes(t)?r.tags.filter(x=>x!==t):[...r.tags,t];save();b.classList.toggle('selected',r.tags.includes(t));b.setAttribute('aria-pressed',String(r.tags.includes(t)));return;}if(b.dataset.eventTopic){b.classList.toggle('selected');b.setAttribute('aria-pressed',String(b.classList.contains('selected')));return;}if(b.dataset.eventEdit){openEvent(b.dataset.eventEdit);return;}if(b.dataset.edit){const [section,id]=b.dataset.edit.split(':');s.cursors[section]=prompts(section,s.statuses[section]).findIndex(x=>x.id===id);$('#summary-dialog').close();go(section);return;}switch(b.dataset.action){case 'new':{const n=newSession(db.sessions.length+1);db.sessions.push(n);db.active=n.id;showProbes=false;save();render();break;}case 'language':s.language=s.language==='en'?'ko':'en';save();render();break;case 'probe':showProbes=!showProbes;render();break;case 'prev':s.cursors[s.section]=Math.max(0,cursor()-1);showProbes=false;save();render();break;case 'later':{const r=response(true);if(!r.tags.includes('추가 확인'))r.tags.push('추가 확인');save();if(hasBranch(s.section)&&prompt().id==='entry'&&!s.statuses[s.section]){const next=sections[sections.findIndex(x=>x.id===s.section)+1];if(next)go(next.id);}else advance();break;}case 'next':advance();break;case 'finish-section':finishSection();break;case 'event':openEvent();break;case 'close-event':$('#event-dialog').close();break;case 'summary':openSummary();break;case 'close-summary':$('#summary-dialog').close();break;case 'backup':download(JSON.stringify(db,null,2),'application/json','사이-인터뷰-전체백업.json');break;case 'export-json':download(JSON.stringify({schema:db.schema,sessions:[s],active:s.id},null,2),'application/json',s.code+'-인터뷰.json');break;case 'export-md':download(summaryText(s),'text/plain;charset=utf-8',s.code+'-인터뷰.txt');break;case 'export-csv':exportCSV();break;case 'import':$('#import-file').click();break;}});
function advance(){const s=current();if(hasBranch(s.section)&&prompt().id==='entry'&&!s.statuses[s.section]){toast('경험 상태를 선택하거나 ‘나중에 확인’으로 넘어가세요.');return;}if(cursor()===list().length-1){finishSection();return;}s.cursors[s.section]=cursor()+1;showProbes=false;save();render();$('#question').focus({preventScroll:true});}
$('#import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw new Error('파일은 10MB 이하만 지원합니다.');const incoming=JSON.parse(await file.text());if(!validateBackup(incoming))throw new Error('지원하는 인터뷰 백업 형식이 아닙니다.');let added=0,duplicates=0;for(const s of incoming.sessions){if(db.sessions.some(x=>x.id===s.id)){duplicates++;continue;}if(db.sessions.some(x=>x.code===s.code))s.code=s.code+' (가져옴 '+(db.sessions.length+1)+')';db.sessions.push(s);added++;}save();render();toast(`${added}개 추가 · 같은 ID ${duplicates}개는 기존 기록을 유지했습니다.`);}catch(err){toast(err.message);}e.target.value='';};
function preserveQuestionText(){for(const s of db.sessions){s.pageInfo??={};for(const page of sections)s.pageInfo[page.id]??={name:page.name,icon:page.icon};}for(const s of db.sessions)for(const [key,r] of Object.entries(s.responses)){if(r.question)continue;const [section,id]=key.split(':');const p=allPrompts(section).find(x=>x.id===id);if(p)r.question=JSON.parse(JSON.stringify(p));}}
preserveQuestionText();
initializeQuestions().then(({site})=>{siteQuestions=site;render();}).catch(()=>render());
window.addEventListener('storage',e=>{if(e.key===QUESTION_KEY){preserveQuestionText();configureQuestions(readSavedConfig()||siteQuestions);render();}});
window.addEventListener('focus',()=>{if(!siteQuestions)return;preserveQuestionText();configureQuestions(readSavedConfig()||siteQuestions);render();});

function hasBranch(id){return sections.find(p=>p.id===id)?.branching??!!topicContent[id];}
function prepareSession(){const s=current();s.pageInfo??={};for(const p of sections)s.pageInfo[p.id]={name:p.name,icon:p.icon};if(!sections.some(p=>p.id===s.section))s.section=sections[0].id;}
function recordSections(s){const all=sections.map(p=>({...p}));for(const key of Object.keys(s.responses)){const id=key.split(':')[0];if(!all.some(p=>p.id===id))all.push({id,name:(s.pageInfo?.[id]?.name||id)+' · 보관된 주제',icon:s.pageInfo?.[id]?.icon||'◌'});}return all;}
</script></body></html>
